server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript application/json application/octet-stream text/css image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
